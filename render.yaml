services:
  - type: web
    name: permaquest
    env: python
    buildCommand: pip install -r requirements.txt
    # Use socketio.run (same path as local) so the monster AI background loop
    # stays on the eventlet hub. gunicorn + import-time tasks often leave
    # monsters frozen on Render even though player moves still work.
    startCommand: python dungeon_crawler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: permaquest-db
          property: connectionString
      # Optional: ADMIN_TOKEN for POST /admin/new_world, NEW_WORLD=1 to force fresh world at boot.

databases:
  - name: permaquest-db
    plan: free
    databaseName: permaquest
    user: permaquest