<!DOCTYPE html>
<html>
<head>
    <title>PermaQuest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ asset_url('css/styles.css') }}">
</head>
<body>
    <div id="player-login">
        What be thy name? <input type="text" id="player-name" />
        <button id="join-btn">Join</button>
    </div>

    <div id="game-shell" class="game-screen" hidden>
        <header id="header" class="game-header">PERMAQUEST</header>

        <section class="message-pane">
            <div id="message-log"></div>
        </section>

        <section id="map-pane" class="map-pane">
            <div class="map-render-surface">
                <canvas id="map-display" class="map-display" aria-label="Dungeon map"></canvas>
            </div>
        </section>

        <section class="player-info-pane">
            <div id="player-properties">
                <div class="properties-grid">
                    <span class="property-label">HP:</span>
                    <span class="property-value" id="player-hp">-</span>
                    <span class="property-label">MP:</span>
                    <span class="property-value" id="player-mp">-</span>

                    <span class="property-label">Name:</span>
                    <span class="property-value" id="player-name-display">-</span>
                    <span class="blank-row"></span>
                    <span class="blank-row"></span>
                    <span class="property-label">LVL:</span>
                    <span class="property-value" id="player-level">1</span>
                    <span class="property-label">ELO:</span>
                    <span class="property-value" id="player-elo">1000</span>

                    <span class="property-label">XP:</span>
                    <span class="property-value" id="player-xp">0</span>
                    <span class="property-label">PQG:</span>
                    <span class="property-value" id="player-pqg">10</span>

                    <span class="blank-row"></span>
                    <span class="blank-row"></span>
                    <span class="blank-row"></span>
                    <span class="blank-row"></span>

                    <span class="property-label">STR:</span>
                    <span class="property-value" id="player-str">-</span>
                    <span class="property-label">INT:</span>
                    <span class="property-value" id="player-int">-</span>

                    <span class="property-label">WIS:</span>
                    <span class="property-value" id="player-wis">-</span>
                    <span class="property-label">CHR:</span>
                    <span class="property-value" id="player-chr">-</span>

                    <span class="property-label">DEX:</span>
                    <span class="property-value" id="player-dex">-</span>
                    <span class="property-label">AGI:</span>
                    <span class="property-value" id="player-agi">-</span>

                    <span class="property-label">ACC:</span>
                    <span class="property-value" id="player-acc">-</span>
                    <span class="blank-row"></span>
                </div>
            </div>

            <div id="game-info">
                <div class="properties-grid"></div>
            </div>
        </section>
    </div>

    <div id="mobile-controls" class="mobile-controls" style="display: none;" aria-label="Movement">
        <div class="mobile-btn" data-direction="nw" aria-label="Northwest">↖</div>
        <div class="mobile-btn" data-direction="n" aria-label="North">↑</div>
        <div class="mobile-btn" data-direction="ne" aria-label="Northeast">↗</div>
        <div class="mobile-btn" data-direction="west" aria-label="West">←</div>
        <button type="button" id="pad-center-btn" class="mobile-btn mobile-btn-center" aria-label="Action">Action</button>
        <div class="mobile-btn" data-direction="e" aria-label="East">→</div>
        <div class="mobile-btn" data-direction="sw" aria-label="Southwest">↙</div>
        <div class="mobile-btn" data-direction="s" aria-label="South">↓</div>
        <div class="mobile-btn" data-direction="se" aria-label="Southeast">↘</div>
    </div>

    <div id="inspect-overlay" class="inspect-overlay" hidden aria-hidden="true">
        <div id="inspect-panel" class="inspect-panel" role="dialog" aria-modal="true" aria-labelledby="inspect-title">
            <div class="inspect-header">
                <h3 id="inspect-title" class="inspect-title"></h3>
                <button type="button" id="inspect-close" class="inspect-close" aria-label="Close">Close</button>
            </div>
            <div id="inspect-body" class="inspect-body"></div>
        </div>
    </div>

    <div id="shop-alert-overlay" class="inspect-overlay shop-alert-overlay" hidden aria-hidden="true">
        <div id="shop-alert-panel" class="inspect-panel shop-alert-panel" role="alertdialog" aria-modal="true" aria-labelledby="shop-alert-message">
            <p id="shop-alert-message" class="shop-alert-message"></p>
            <div id="shop-alert-actions" class="shop-alert-actions">
                <button type="button" id="shop-alert-ok" class="inspect-close shop-alert-ok">OK</button>
                <button type="button" id="shop-alert-cancel" class="inspect-close shop-alert-cancel" hidden>Cancel</button>
            </div>
        </div>
    </div>

    <div id="inventory-overlay" class="inspect-overlay inventory-overlay" hidden aria-hidden="true">
        <div id="inventory-panel" class="inspect-panel inventory-panel" role="dialog" aria-modal="true" aria-labelledby="inventory-title">
            <div class="inspect-header">
                <h3 id="inventory-title" class="inspect-title">Action</h3>
                <button type="button" id="inventory-close" class="inspect-close" aria-label="Close">Close</button>
            </div>
            <div class="inventory-body">
                <div id="inventory-grid" class="inventory-grid"></div>
                <div id="inventory-detail" class="inventory-detail" hidden aria-live="polite"></div>
                <div id="action-spells" class="action-spells" hidden>
                    <h4 class="action-spells-heading">Spells</h4>
                    <div id="action-spells-list" class="action-spells-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="interaction-overlay" class="inspect-overlay interaction-overlay" hidden aria-hidden="true">
        <div id="interaction-panel" class="inspect-panel interaction-panel" role="dialog" aria-modal="true" aria-labelledby="interaction-title">
            <div class="inspect-header">
                <h3 id="interaction-title" class="inspect-title">Encounter</h3>
                <span id="interaction-countdown" class="interaction-countdown" aria-live="polite"></span>
            </div>
            <p id="interaction-message" class="interaction-message"></p>
            <div id="interaction-choices" class="interaction-choices"></div>
        </div>
    </div>

    <div id="chat-overlay" class="inspect-overlay chat-overlay" hidden aria-hidden="true">
        <div id="chat-panel" class="inspect-panel chat-panel" role="dialog" aria-modal="true" aria-labelledby="chat-title">
            <div class="inspect-header">
                <h3 id="chat-title" class="inspect-title">Chat</h3>
                <button type="button" id="chat-end" class="inspect-close" aria-label="Leave chat">End Chat</button>
            </div>
            <div id="chat-roster" class="chat-roster" aria-live="polite"></div>
            <div id="chat-log" class="chat-log" aria-live="polite"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" class="chat-input" maxlength="200" autocomplete="off" placeholder="Type a message..." />
                <button type="button" id="chat-send" class="inspect-close chat-send">Send</button>
            </div>
        </div>
    </div>

    <input type="hidden" id="player-id" value="">

    <div id="combat-overlay" class="combat-overlay" hidden aria-hidden="true">
        <div id="combat-screen" class="combat-screen" role="dialog" aria-modal="true" aria-labelledby="combat-status">
            <div id="combat-status" class="combat-statusbar" aria-live="polite"></div>
            <div id="combat-roster" class="combat-roster" aria-label="Opponents"></div>
            <div id="combat-self" class="combat-self" aria-label="You"></div>
            <div id="combat-message-container" class="combat-message-container">
                <div id="combat-log" class="combat-log" aria-live="polite"></div>
                <p id="opponent-thinking" class="opponent-thinking" style="display: none;"></p>
            </div>
            <div id="combat-controls" class="combat-controls">
                <button type="button" id="attack-btn">Attack</button>
                <button type="button" id="defend-btn">Defend</button>
                <button type="button" id="spell-btn">Spell</button>
                <button type="button" id="item-btn">Item</button>
                <button type="button" id="run-btn">Run</button>
                <button type="button" id="spell-cancel-btn" class="combat-spell-cancel-btn" hidden>
                    Back
                </button>
                <button type="button" id="map-peek-btn" class="combat-map-peek-btn"
                    aria-label="Hold to view dungeon map">Map</button>
            </div>
            <div id="combat-social-controls" class="combat-controls combat-social-controls" hidden aria-hidden="true">
                <button type="button" id="alliance-btn">Alliance</button>
                <button type="button" id="chat-btn">Chat</button>
            </div>
        </div>
    </div>

    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/floor.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/grass.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/tree.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/boulder.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/brickwall.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/mountain.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/stairsup.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/stairsdown.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/door.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/road.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/desk.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/roof.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/items_shop_sign.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/weapon_shop_sign.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='tiles/armour_shop_sign.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='npcs/shopkeeper.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='monsters/sprites/troll.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='monsters/portraits/troll.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='monsters/sprites/skeleton.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='monsters/portraits/skeleton.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='player/sprites/player_walk1.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='player/sprites/player_walk2.png') }}">
    <link rel="preload" as="image" href="{{ url_for('static', filename='player/sprites/player_walk3.png') }}">
    <script src="{{ asset_url('js/sound.js') }}"></script>
    <script src="{{ asset_url('js/map_view.js') }}"></script>
    <script src="{{ asset_url('js/tile_assets.js') }}"></script>
    <script src="{{ asset_url('js/monster_assets.js') }}"></script>
    <script src="{{ asset_url('js/item_assets.js') }}"></script>
    <script src="{{ asset_url('js/player_assets.js') }}"></script>
    <script src="{{ asset_url('js/player_presentation.js') }}"></script>
    <script src="{{ asset_url('js/map_renderer.js') }}"></script>
    <script src="{{ asset_url('js/inspect_ui.js') }}"></script>
    <script src="{{ asset_url('js/inventory_ui.js') }}"></script>
    <script src="{{ asset_url('js/spell_ui.js') }}"></script>
    <script src="{{ asset_url('js/interaction_ui.js') }}"></script>
    <script src="{{ asset_url('js/map_inspect.js') }}"></script>
    <script src="{{ asset_url('js/map_gestures.js') }}"></script>
    <script src="{{ asset_url('js/ui.js') }}"></script>
    <script src="{{ asset_url('js/combat_social.js') }}"></script>
    <script src="{{ asset_url('js/combat.js') }}"></script>
    <script src="{{ asset_url('js/socket.js') }}"></script>
    <script src="{{ asset_url('js/movement_controller.js') }}"></script>
    <script src="{{ asset_url('js/main.js') }}"></script>
</body>
</html>
